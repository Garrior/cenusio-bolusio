name: Daily board game prices

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-board-game-prices
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ${{ vars.PRICE_SCRAPER_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 330
    env:
      ALLEGRO_CLIENT_ID: ${{ secrets.ALLEGRO_CLIENT_ID }}
      ALLEGRO_CLIENT_SECRET: ${{ secrets.ALLEGRO_CLIENT_SECRET }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Collect prices
        run: python scraper.py
      - name: Commit price history
        shell: bash
        run: |
          if [ -n "$(git status --porcelain data/)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A -- data/
            git commit -m "chore: update game catalog and prices"
            git push
          fi
